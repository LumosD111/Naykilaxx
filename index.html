<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Keuangan Sederhana untuk UMKM</title>
<style>
:root{--canvas:#f1f2f4;--paper:#fff;--ink:#15191f;--muted:#667085;--line:#e3e5e9;--in:#15803d;--in-soft:#dcf5e5;--out:#c62828;--out-soft:#fde4e2}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--canvas);color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.sub{color:var(--muted);margin-top:4px}
h2{font-size:1.05rem;font-weight:650;margin-bottom:14px}

.summary{display:grid;gap:12px;margin-top:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat span{display:block;color:var(--muted);font-size:.9rem}
.stat b{display:block;margin-top:2px;font-size:1.5rem;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat.saldo{background:var(--ink);border-color:var(--ink);color:#fff}
.stat.saldo span{color:#aab1bd}
.stat.saldo b{font-size:2.1rem}
.stat.saldo b.neg{color:#ff9b93}
.stat.in{border-left:4px solid var(--in)}
.stat.in b{color:var(--in)}
.stat.out{border-left:4px solid var(--out)}
.stat.out b{color:var(--out)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.fields{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:.9rem;font-weight:550;color:#344054}
input,select{font:inherit;font-weight:400;color:var(--ink);background:#fff;border:1px solid #cdd1d8;border-radius:8px;padding:10px 12px;width:100%}
:is(input,select,button):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.money{position:relative}
.rpfix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money input{padding-left:40px}
.save{font:inherit;font-weight:600;color:#fff;background:var(--ink);border:0;border-radius:8px;padding:11px 20px;cursor:pointer}
.save:hover{background:#2a313c}

.scroll{overflow-x:auto}
table{width:100%;min-width:540px;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:.85rem;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.in{color:var(--in)}
td.out{color:var(--out)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600}
.tag.in{background:var(--in-soft);color:var(--in)}
.tag.out{background:var(--out-soft);color:var(--out)}
.del{font:inherit;font-size:.85rem;color:var(--muted);background:none;border:0;border-radius:6px;padding:4px 6px;cursor:pointer}
.del:hover,.del.arm{color:var(--out)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

@media(min-width:620px){
  .fields{grid-template-columns:1fr 1fr}
  .save{grid-column:1/-1;justify-self:start}
}
@media(min-width:760px){
  .summary{grid-template-columns:1.5fr 1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laporan Keuangan Sederhana untuk UMKM</h1>
    <p class="sub">Catat uang masuk dan keluar usaha Anda. Data tersimpan otomatis di browser ini.</p>
  </header>

  <section class="summary" aria-label="Ringkasan keuangan">
    <div class="stat saldo"><span>Total Saldo Saat Ini</span><b id="saldo">Rp&nbsp;0</b></div>
    <div class="stat in"><span>Total Pemasukan</span><b id="masuk">Rp&nbsp;0</b></div>
    <div class="stat out"><span>Total Pengeluaran</span><b id="keluar">Rp&nbsp;0</b></div>
  </section>

  <section class="panel">
    <h2>Catat transaksi</h2>
    <div class="fields">
      <label>Jenis Transaksi
        <select id="jenis">
          <option value="in">Pemasukan</option>
          <option value="out">Pengeluaran</option>
        </select>
      </label>
      <label>Tanggal
        <input type="date" id="tanggal" required>
      </label>
      <label>Keterangan
        <input type="text" id="ket" maxlength="80" placeholder="Nama barang atau jasa, mis. Penjualan kopi susu" required>
      </label>
      <label>Nominal
        <div class="money">
          <span class="rpfix" aria-hidden="true">Rp</span>
          <input type="text" id="nominal" inputmode="numeric" autocomplete="off" placeholder="0" required>
        </div>
      </label>
      <button type="button" class="save" id="save">Simpan Transaksi</button>
    </div>
  </section>

  <section class="panel">
    <h2>Riwayat transaksi (buku kas)</h2>
    <div class="scroll">
      <table>
        <thead>
          <tr><th>Tanggal</th><th>Keterangan</th><th>Jenis</th><th class="r">Nominal</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const KEY='umkm_buku_kas_v1',$=id=>document.getElementById(id);
const rp=n=>'Rp\u00a0'+n.toLocaleString('id-ID');
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const dmy=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};

let data=[];
try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
data=Array.isArray(data)?data.filter(t=>t&&Number.isFinite(t.id)&&Number.isFinite(t.nominal)&&(t.jenis==='in'||t.jenis==='out')&&/^\d{4}-\d\d-\d\d$/.test(t.tanggal)&&typeof t.ket==='string'):[];
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};

function render(){
  let masuk=0,keluar=0;
  data.forEach(t=>t.jenis==='in'?masuk+=t.nominal:keluar+=t.nominal);
  const s=masuk-keluar;
  $('masuk').textContent=rp(masuk);
  $('keluar').textContent=rp(keluar);
  $('saldo').textContent=(s<0?'-':'')+rp(Math.abs(s));
  $('saldo').classList.toggle('neg',s<0);
  const rows=[...data].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.id-a.id);
  $('rows').innerHTML=rows.length?rows.map(t=>`<tr><td>${dmy(t.tanggal)}</td><td>${esc(t.ket)}</td><td><span class="tag ${t.jenis}">${t.jenis==='in'?'Pemasukan':'Pengeluaran'}</span></td><td class="r ${t.jenis}">${t.jenis==='in'?'+':'-'}${rp(t.nominal)}</td><td class="r"><button type="button" class="del" data-id="${t.id}">Hapus</button></td></tr>`).join(''):'<tr><td class="empty" colspan="5">Belum ada transaksi. Isi form di atas lalu klik Simpan Transaksi.</td></tr>';
}

function add(){
  const t=$('tanggal'),k=$('ket'),n=$('nominal'),v=+n.value.replace(/\D/g,'');
  [t,k,n].forEach(i=>i.setCustomValidity(''));
  if(!k.value.trim())k.setCustomValidity('Isi nama barang atau jasa.');
  if(!v)n.setCustomValidity('Isi nominal lebih dari 0.');
  const bad=[t,k,n].find(i=>!i.checkValidity());
  if(bad){bad.reportValidity();return}
  data.push({id:Date.now(),jenis:$('jenis').value,tanggal:t.value,ket:k.value.trim(),nominal:v});
  persist();render();
  k.value=n.value='';k.focus();
}

$('save').onclick=add;
$('nominal').oninput=e=>{const d=e.target.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,12);e.target.value=d?(+d).toLocaleString('id-ID'):''};
document.querySelector('.fields').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();add()}};
$('rows').onclick=e=>{
  const b=e.target.closest('.del');if(!b)return;
  if(b.classList.contains('arm')){data=data.filter(t=>t.id!==+b.dataset.id);persist();render();return}
  b.classList.add('arm');b.textContent='Yakin hapus?';
  setTimeout(()=>{b.classList.remove('arm');b.textContent='Hapus'},3000);
};

$('tanggal').value=today();
render();
</script>
</body>
</html>
